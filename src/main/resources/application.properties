# ------------------------------------------------------------------------------------------------------------
# ---------------------------
# Configuracion de Hibernate / JPA
# ---------------------------

# Indica que debe hacer Hibernate con las tablas:
# Opciones:
# - none: No hace nada.
# - validate: Verifica que las tablas existan y coincidan con las entidades (no crea ni actualiza).
# - update: Crea tablas nuevas o modifica las existentes sin borrar datos.
# - create: Borra todo y crea las tablas de cero al arrancar (cuidado! se pierden datos).
# - create-drop: Crea las tablas al iniciar y las borra al apagar la app.
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola las consultas SQL que ejecuta Hibernate (muy util para debug)
spring.jpa.show-sql=true

# Dialecto de base de datos: le indica a Hibernate como generar las consultas SQL especificas para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
