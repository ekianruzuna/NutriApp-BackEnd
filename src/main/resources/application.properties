# ---------------------------
# Configuración de la base de datos
# ---------------------------

# URL de conexión a la base de datos MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/NutriApp

# Usuario de la base de datos
spring.datasource.username=root

# Contraseña de la base de datos
spring.datasource.password=puan3449

# Driver JDBC que se usa para conectarse a MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------
# Configuración de Hibernate / JPA
# ---------------------------

# Indica qué debe hacer Hibernate con las tablas:
# Opciones:
# - none: No hace nada.
# - validate: Verifica que las tablas existan y coincidan con las entidades (no crea ni actualiza).
# - update: Crea tablas nuevas o modifica las existentes sin borrar datos.
# - create: Borra todo y crea las tablas de cero al arrancar (¡cuidado! se pierden datos).
# - create-drop: Crea las tablas al iniciar y las borra al apagar la app.
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola las consultas SQL que ejecuta Hibernate (muy útil para debug)
spring.jpa.show-sql=true

# Dialecto de base de datos: le indica a Hibernate cómo generar las consultas SQL específicas para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
